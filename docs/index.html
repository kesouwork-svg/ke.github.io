<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KE 工具集合</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f6f8;color:#2c3e50;font-size:14px;line-height:1.5;min-height:100vh}
a{text-decoration:none;color:inherit}
.p-header{background:#fff;border-bottom:2px solid #e8ecf0;padding:12px 16px;display:flex;align-items:center;gap:10px}
.p-header img{height:38px;width:auto;display:block}
.p-title{font-size:16px;font-weight:600;color:#1a2332}
.p-title span{color:#4a90d9}
.p-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.p-user{font-size:12.5px;color:#718096;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{padding:6px 12px;border:1px solid #d1d9e0;border-radius:6px;background:#fff;color:#4a5568;font-size:12.5px;cursor:pointer;font-family:inherit;min-height:34px}
.btn:hover{border-color:#4a90d9;color:#4a90d9;background:#f0f7ff}
.p-main{max-width:900px;margin:0 auto;padding:22px 14px 40px}
.p-sub{font-size:13px;color:#718096;margin-bottom:14px}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:all .15s}
.card:hover{border-color:#4a90d9;box-shadow:0 2px 10px rgba(74,144,217,.08)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-name{font-size:15px;font-weight:600;color:#1a2332;display:flex;align-items:center;gap:7px}
.card-icon{width:28px;height:28px;border-radius:8px;background:#e6f1fb;display:flex;align-items:center;justify-content:center;font-size:14px}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-edit{background:#eaf3de;color:#3b6d11}
.b-read{background:#f1efe8;color:#5f5e5a}
.b-roi1{background:#e6f1fb;color:#185fa5}
.b-roi2{background:#faeeda;color:#854f0b}
.card-desc{font-size:12.5px;color:#718096;line-height:1.65;min-height:44px}
.card-foot{border-top:1px solid #f0f3f6;padding-top:10px;display:flex;align-items:center;justify-content:space-between}
.card-meta{font-size:11.5px;color:#a0aec0}
.go{font-size:12.5px;padding:6px 14px;border-radius:6px;background:#4a90d9;color:#fff;border:1px solid #4a90d9}
.card:hover .go{background:#3a7bc8}
.tip{margin-top:14px;background:#fff;border:1px dashed #d1d9e0;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#718096;line-height:1.7}
.tip b{color:#2d3748;font-weight:500}
</style>
</head>
<body>

<div class="p-header">
  <img src="./images/logo_cat.png" alt="KE">
  <div class="p-title">KE <span>工具集合</span></div>
  <div class="p-right">
    <span class="p-user" id="p-user"></span>
    <button class="btn" onclick="pLogout()">退出</button>
  </div>
</div>

<div class="p-main">
  <div class="p-sub">选择要使用的工具</div>
  <div class="cards">

    <a class="card" href="./roi/index.html" onclick="markTool('roi')">
      <div class="card-top">
        <div class="card-name"><span class="card-icon">📐</span>ROI 计算器</div>
        <span class="badge" id="badge-roi">—</span>
      </div>
      <div class="card-desc">设备投资回报测算:立项评估与实际两套数据、投资卡片明细、年度投入产出比与回收期。</div>
      <div class="card-foot">
        <span class="card-meta">项目投资分析</span>
        <span class="go">进入</span>
      </div>
    </a>

    <a class="card" href="./equipment/index.html" onclick="markTool('equipment')">
      <div class="card-top">
        <div class="card-name"><span class="card-icon">🔧</span>设备履历卡</div>
        <span class="badge" id="badge-eq">—</span>
      </div>
      <div class="card-desc">现场设备维修与大修台账:扫码录入、备件与费用、故障统计、编辑留痕。</div>
      <div class="card-foot">
        <span class="card-meta">设备台账与维修</span>
        <span class="go">进入</span>
      </div>
    </a>

  </div>

  <div class="tip">
    <b>小提示:</b>登录页可以勾选「登录后直接进入上次使用的工具」,勾上后登录就不再经过这一页;在任何工具里点右上角<b>「🧰 切换工具」</b>都能回到这里。
  </div>
</div>

<script>
function pSession(){
    try{return JSON.parse(sessionStorage.getItem('roi_session')||'null');}catch(e){return null;}
}
function pLogout(){
    try{sessionStorage.removeItem('roi_session');}catch(e){}
    location.href='./login.html';
}
function markTool(t){
    try{localStorage.setItem('last_tool',t);}catch(e){}
}
(function(){
    var s=pSession();
    if(!s){location.href='./login.html?next='+encodeURIComponent('index.html');return;}
    document.getElementById('p-user').textContent=(s.name||s.account||'')+(s.guest?' · 游客':'');
    // ROI:1级全量 / 2级限本人项目 / 游客只读
    var bRoi=document.getElementById('badge-roi');
    if(s.guest){bRoi.className='badge b-read';bRoi.textContent='只读';}
    else if(s.level===1){bRoi.className='badge b-roi1';bRoi.textContent='1级 · 全量';}
    else{bRoi.className='badge b-roi2';bRoi.textContent='2级 · 本人项目';}
    // 设备履历:有 tools 里的 equipment 才可编辑
    var bEq=document.getElementById('badge-eq');
    var hasEq=!s.guest&&((s.tools&&s.tools.indexOf('equipment')>-1)||s.account==='admin'||s.level===1);
    if(hasEq){bEq.className='badge b-edit';bEq.textContent='可编辑';}
    else{bEq.className='badge b-read';bEq.textContent='只读';}
})();
</script>
</body>
</html>
