<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>设备履历卡 · KE</title>
<link rel="stylesheet" href="./css/equipment.css">
</head>
<body>

<div class="eq-header">
  <img class="logo" src="../images/logo_cat.png" alt="KE">
  <div class="eq-title">设备<span>履历卡</span></div>
  <div class="eq-header-right">
    <span class="eq-user" id="eq-user"></span>
    <a class="tool-switch" href="../index.html">🧰 切换工具</a>
    <a class="tool-switch" href="../roi/index.html">ROI 计算器</a>
  </div>
</div>
<div class="ro-banner" id="ro-banner"></div>

<div class="eq-main">

  <!-- ================= 列表 + 详情 ================= -->
  <div class="view show" id="view-list">
    <div class="view-list-wrap">
      <div>
        <div class="toolbar">
          <input type="text" id="f-q" placeholder="搜索编号/名称/型号/责任人">
          <select id="f-line"><option value="">全部产线</option></select>
          <select id="f-status">
            <option value="">全部状态</option>
            <option value="active">在用</option>
            <option value="idle">闲置</option>
            <option value="scrapped">报废</option>
          </select>
        </div>
        <div class="toolbar">
          <button class="btn btn-primary" style="flex:1" onclick="openArchiveForm('')">＋ 新增设备</button>
          <button class="btn" style="flex:1" onclick="showLabels()">打印二维码</button>
        </div>
        <div class="sec-title"><span id="eq-count">共 0 台</span></div>
        <div class="eq-list" id="eq-list"></div>
      </div>
      <div id="detail-panel">
        <div class="empty" id="detail-content">从左侧选择设备,或点「新增设备」建档</div>
      </div>
    </div>
  </div>

  <!-- ================= 履历录入 ================= -->
  <div class="view" id="view-record">
    <div class="sec-title"><span id="record-title">录入履历</span></div>

    <div class="fold open">
      <div class="fold-head">基本信息<span class="arrow">▾</span></div>
      <div class="fold-body">
        <div class="form-row">
          <label class="req">类型</label>
          <select id="r-type">
            <option value="fault">故障维修</option>
            <option value="maintain">定期保养</option>
            <option value="overhaul">大修</option>
            <option value="modify">改造</option>
            <option value="inspect">点检</option>
          </select>
        </div>
        <div class="form-2">
          <div class="form-row"><label class="req">日期</label><input type="date" id="r-date"></div>
          <div class="form-row"><label>处理人</label><input type="text" id="r-handler" placeholder="谁处理的"></div>
        </div>
      </div>
    </div>

    <div class="fold open">
      <div class="fold-head">故障 / 事项描述<span class="arrow">▾</span></div>
      <div class="fold-body">
        <div class="form-row">
          <label class="req">现象</label>
          <textarea id="r-symptom" placeholder="例:伺服报警停机,面板显示 AL-24"></textarea>
          <div class="chips" id="quick-chips"></div>
        </div>
        <div class="form-row">
          <label>原因分类</label>
          <select id="r-causeCat">
            <option value="">未分类</option>
            <option value="mechanical">机械</option>
            <option value="electrical">电气</option>
            <option value="pneumatic">气动</option>
            <option value="hydraulic">液压</option>
            <option value="software">软件/程序</option>
            <option value="operation">操作不当</option>
            <option value="wear">备件老化</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-row"><label>原因分析</label><textarea id="r-cause" placeholder="根因是什么"></textarea></div>
      </div>
    </div>

    <div class="fold open">
      <div class="fold-head">处理与费用<span class="arrow">▾</span></div>
      <div class="fold-body">
        <div class="form-row"><label class="req">处理措施</label><textarea id="r-action" placeholder="换了什么、怎么修的"></textarea></div>
        <div class="form-2">
          <div class="form-row">
            <label>是否彻底解决</label>
            <select id="r-resolved"><option value="yes">是</option><option value="no">否(待观察)</option></select>
          </div>
          <div class="form-row"><label>停机时长(小时)</label><input type="number" inputmode="decimal" min="0" step="0.5" id="r-down" placeholder="2.5"></div>
        </div>
        <div class="form-row">
          <label>备件明细</label>
          <div id="parts-wrap"></div>
          <datalist id="part-pool"></datalist>
          <div class="hint">名称可从历史备件中选,也可以直接手打新名称</div>
        </div>
        <div class="form-2">
          <div class="form-row"><label>人工费(元)</label><input type="number" inputmode="decimal" min="0" step="1" id="r-labor" placeholder="0" oninput="updatePartsTotal()"></div>
          <div class="form-row"><label>外委费(元)</label><input type="number" inputmode="decimal" min="0" step="1" id="r-outsource" placeholder="0" oninput="updatePartsTotal()"></div>
        </div>
        <div class="part-total-line"><span>本次维修合计</span><b id="r-total">¥0</b></div>
        <div class="form-row" style="margin-top:12px"><label>备注</label><textarea id="r-remark" placeholder="其他需要说明的"></textarea></div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="btn" onclick="openDetail(currentCode)">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存履历</button>
    </div>
  </div>

  <!-- ================= 设备档案 ================= -->
  <div class="view" id="view-archive">
    <div class="sec-title"><span id="archive-title">新增设备</span></div>
    <div class="form-card">
      <div class="form-2">
        <div class="form-row"><label class="req">设备编号</label><input type="text" id="a-code" placeholder="EQ-001"></div>
        <div class="form-row"><label class="req">设备名称</label><input type="text" id="a-name" placeholder="一号线 装配机"></div>
      </div>
      <div class="form-2">
        <div class="form-row"><label>型号</label><input type="text" id="a-model" placeholder="ZP-200"></div>
        <div class="form-row"><label>厂商</label><input type="text" id="a-vendor" placeholder="厂商名称"></div>
      </div>
      <div class="form-2">
        <div class="form-row"><label>产线 / 工位</label><input type="text" id="a-line" placeholder="一号线"></div>
        <div class="form-row"><label>责任人</label><input type="text" id="a-owner" placeholder="张三"></div>
      </div>
      <div class="form-2">
        <div class="form-row"><label>投用日期</label><input type="date" id="a-install"></div>
        <div class="form-row">
          <label>状态</label>
          <select id="a-status"><option value="active">在用</option><option value="idle">闲置</option><option value="scrapped">报废</option></select>
        </div>
      </div>
      <div class="form-row"><label>备注</label><textarea id="a-remark" placeholder="关键参数、注意事项"></textarea></div>
    </div>
    <div class="bottom-bar">
      <button class="btn" onclick="openDetail(currentCode)">取消</button>
      <button class="btn btn-primary" onclick="saveArchive()">保存设备</button>
    </div>
  </div>

  <!-- ================= 二维码标签 ================= -->
  <div class="view" id="view-labels">
    <div class="label-toolbar">
      <button class="btn" onclick="openDetail(currentCode)">返回</button>
      <button class="btn btn-primary" onclick="printLabels()">打印标签</button>
      <span class="hint" style="margin:0">打印尺寸 60×40mm,建议用不干胶标签纸</span>
    </div>
    <div class="labels" id="labels-wrap"></div>
  </div>

  <!-- ================= 编辑记录 ================= -->
  <div class="view" id="view-audit">
    <div id="audit-content"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="../js/supabase.js"></script>
<script src="./js/qrcode.min.js"></script>
<script src="./js/equipment-api.js"></script>
<script src="./js/equipment-app.js"></script>
</body>
</html>
